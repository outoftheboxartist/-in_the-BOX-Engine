name: Apply SVG security patch

on:
  push:
    branches:
      - security/svg-sanitization

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/svg-sanitization

      - name: Apply sanitizer changes
        shell: bash
        run: |
          if [ -f src/utils/svgSanitizer.ts ]; then
            echo "Patch already applied"
            exit 0
          fi

          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace('src/App.tsx',
              'import { generateLinesData, clipLineToPolygon, getPolygonFromElement } from "./utils/slicing";\n',
              'import { generateLinesData, clipLineToPolygon, getPolygonFromElement } from "./utils/slicing";\nimport { sanitizeSvg } from "./utils/svgSanitizer";\n')
          replace('src/App.tsx',
              '          setSvgContent(savedSvgContent);\n          if (savedOriginalSvgContent) setOriginalSvgContent(savedOriginalSvgContent);',
              '          setSvgContent(sanitizeSvg(savedSvgContent));\n          if (savedOriginalSvgContent) setOriginalSvgContent(sanitizeSvg(savedOriginalSvgContent));')
          replace('src/App.tsx',
              '                  setSvgContent(newSvg);\n                  setOriginalSvgContent(newSvg);',
              '                  const safeSvg = sanitizeSvg(newSvg);\n                  setSvgContent(safeSvg);\n                  setOriginalSvgContent(safeSvg);')

          replace('src/components/ImageTracerModal.tsx',
              'import { traceImageContours } from "../imageTracer";\n',
              'import { traceImageContours } from "../imageTracer";\nimport { sanitizeSvg } from "../utils/svgSanitizer";\n')
          replace('src/components/ImageTracerModal.tsx',
              '        const svgResult = traceImageContours(canvas, threshold, invert, smoothing, trimOverlaps, minRegionPixels);',
              '        const svgResult = sanitizeSvg(\n          traceImageContours(canvas, threshold, invert, smoothing, trimOverlaps, minRegionPixels),\n        );')

          replace('src/svgParser.ts',
              'import { SVGZoneInfo, ZoneSettings } from "./types";\n',
              'import { SVGZoneInfo, ZoneSettings } from "./types";\nimport { sanitizeSvg } from "./utils/svgSanitizer";\n')
          replace('src/svgParser.ts',
              '  try {\n    const parser = new DOMParser();\n    // Parse the raw input text\n    const doc = parser.parseFromString(svgText, "image/svg+xml");',
              '  try {\n    const safeSvgText = sanitizeSvg(svgText);\n    const parser = new DOMParser();\n    // Parse the raw input text\n    const doc = parser.parseFromString(safeSvgText, "image/svg+xml");')
          PY

          cat > src/utils/svgSanitizer.ts <<'TS'
          const BLOCKED_ELEMENTS = new Set([
            "animate",
            "animatemotion",
            "animatetransform",
            "base",
            "discard",
            "embed",
            "foreignobject",
            "handler",
            "iframe",
            "link",
            "listener",
            "meta",
            "object",
            "script",
            "set",
          ]);

          const URL_ATTRIBUTES = new Set(["href", "src", "xlink:href"]);
          const URL_PRESENTATION_ATTRIBUTES = new Set([
            "clip-path",
            "cursor",
            "fill",
            "filter",
            "marker",
            "marker-end",
            "marker-mid",
            "marker-start",
            "mask",
            "stroke",
          ]);

          const SAFE_RASTER_DATA_URL = /^data:image\/(?:png|gif|jpe?g|webp);base64,[a-z0-9+/=\s]+$/i;
          const LOCAL_FRAGMENT_URL = /^#[A-Za-z_][\w:.-]*$/;
          const LOCAL_URL_FUNCTION = /^url\(\s*(["']?)#[A-Za-z_][\w:.-]*\1\s*\)$/i;

          type XmlParser = {
            parseFromString(source: string, mimeType: string): Document;
          };

          type XmlSerializer = {
            serializeToString(node: Node): string;
          };

          export interface SvgSanitizerEnvironment {
            parser: XmlParser;
            serializer: XmlSerializer;
          }

          function browserEnvironment(): SvgSanitizerEnvironment {
            if (typeof DOMParser === "undefined" || typeof XMLSerializer === "undefined") {
              throw new Error("SVG sanitization requires DOMParser and XMLSerializer support");
            }

            return {
              parser: new DOMParser(),
              serializer: new XMLSerializer(),
            };
          }

          function normalizedAttributeName(attribute: Attr): string {
            return attribute.name.toLowerCase();
          }

          function containsUnsafeCss(css: string): boolean {
            return /(?:javascript\s*:|vbscript\s*:|expression\s*\(|-moz-binding\s*:|behavior\s*:|@|\\)/i.test(css);
          }

          function sanitizeCss(css: string): string {
            if (containsUnsafeCss(css)) return "";

            return css.replace(/url\(\s*(["']?)(.*?)\1\s*\)/gi, (match, _quote: string, rawUrl: string) => {
              return LOCAL_FRAGMENT_URL.test(rawUrl.trim()) ? match : "none";
            });
          }

          function isSafeDirectReference(value: string, elementName: string): boolean {
            const normalized = value.trim();
            if (!normalized) return true;
            if (LOCAL_FRAGMENT_URL.test(normalized)) return true;

            return elementName === "image" && SAFE_RASTER_DATA_URL.test(normalized);
          }

          function sanitizeElement(element: Element): void {
            const elementName = element.localName.toLowerCase();

            for (const attribute of Array.from(element.attributes)) {
              const name = normalizedAttributeName(attribute);
              const localName = attribute.localName.toLowerCase();
              const value = attribute.value;

              if (localName.startsWith("on") || name.startsWith("on")) {
                element.removeAttributeNode(attribute);
                continue;
              }

              if (name === "style") {
                const safeStyle = sanitizeCss(value);
                if (safeStyle) element.setAttribute(attribute.name, safeStyle);
                else element.removeAttributeNode(attribute);
                continue;
              }

              if ((URL_ATTRIBUTES.has(name) || URL_ATTRIBUTES.has(localName)) && !isSafeDirectReference(value, elementName)) {
                element.removeAttributeNode(attribute);
                continue;
              }

              if (URL_PRESENTATION_ATTRIBUTES.has(name)) {
                const normalized = value.trim();
                if (/^url\(/i.test(normalized) && !LOCAL_URL_FUNCTION.test(normalized)) {
                  element.removeAttributeNode(attribute);
                }
              }
            }

            if (elementName === "style") {
              element.textContent = sanitizeCss(element.textContent || "");
            }
          }

          export function sanitizeSvg(
            svgText: string,
            environment: SvgSanitizerEnvironment = browserEnvironment(),
          ): string {
            const doc = environment.parser.parseFromString(svgText, "image/svg+xml");
            const parserError = doc.getElementsByTagName("parsererror")[0];
            if (parserError) {
              throw new Error(parserError.textContent || "Invalid SVG XML syntax");
            }

            const root = doc.documentElement;
            if (!root || root.localName.toLowerCase() !== "svg") {
              throw new Error("No <svg> element found in the uploaded content");
            }

            const elements = [root, ...Array.from(root.getElementsByTagName("*"))];
            for (const element of elements) {
              if (BLOCKED_ELEMENTS.has(element.localName.toLowerCase())) {
                element.parentNode?.removeChild(element);
                continue;
              }
              sanitizeElement(element);
            }

            return environment.serializer.serializeToString(doc);
          }
          TS

          cat > src/utils/svgSanitizer.fixtures.ts <<'TS'
          import { sanitizeSvg } from "./svgSanitizer";

          interface SanitizerFixture {
            name: string;
            input: string;
            includes: string[];
            excludes: string[];
          }

          export const SVG_SANITIZER_FIXTURES: SanitizerFixture[] = [
            {
              name: "preserves normal grouped path artwork",
              input: '<svg viewBox="0 0 20 20"><defs><clipPath id="crop"><rect width="10" height="10"/></clipPath></defs><g id="layer" transform="translate(2 3)" clip-path="url(#crop)"><path id="curve" d="M0 0L10 10" fill="#fff" stroke="#000"/></g></svg>',
              includes: ['viewBox="0 0 20 20"', '<g id="layer"', 'transform="translate(2 3)"', 'clip-path="url(#crop)"', '<path id="curve"'],
              excludes: [],
            },
            {
              name: "removes script elements",
              input: '<svg xmlns="http://www.w3.org/2000/svg"><script>alert(1)</script><path d="M0 0L1 1"/></svg>',
              includes: ['<path d="M0 0L1 1"'],
              excludes: ["<script", "alert(1)"],
            },
            {
              name: "removes inline event handlers",
              input: '<svg xmlns="http://www.w3.org/2000/svg" onload="alert(1)"><image onerror="alert(2)"/><path onclick="alert(3)" d="M0 0L1 1"/></svg>',
              includes: ['<path d="M0 0L1 1"'],
              excludes: ["onload", "onerror", "onclick", "alert("],
            },
            {
              name: "removes javascript and external references",
              input: '<svg xmlns="http://www.w3.org/2000/svg"><a href="javascript:alert(1)"><path d="M0 0L1 1"/></a><use href="https://example.com/art.svg#shape"/><set attributeName="href" to="javascript:alert(2)"/><image href="data:image/png;base64,AAAA"/></svg>',
              includes: ['<path d="M0 0L1 1"', 'href="data:image/png;base64,AAAA"'],
              excludes: ["javascript:", "https://example.com", "<set"],
            },
            {
              name: "removes embedded HTML",
              input: '<svg xmlns="http://www.w3.org/2000/svg"><foreignObject><div xmlns="http://www.w3.org/1999/xhtml">unsafe</div></foreignObject><circle cx="5" cy="5" r="4"/></svg>',
              includes: ["<circle"],
              excludes: ["foreignObject", "<div", "unsafe"],
            },
          ];

          /** Deterministic browser-DOM fixture runner for the centralized sanitizer. */
          export function runSvgSanitizerFixtures(): void {
            for (const fixture of SVG_SANITIZER_FIXTURES) {
              const sanitized = sanitizeSvg(fixture.input);
              for (const expected of fixture.includes) {
                if (!sanitized.includes(expected)) {
                  throw new Error(`${fixture.name}: expected output to include ${expected}`);
                }
              }
              for (const forbidden of fixture.excludes) {
                if (sanitized.includes(forbidden)) {
                  throw new Error(`${fixture.name}: expected output to exclude ${forbidden}`);
                }
              }
            }
          }
          TS

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/ImageTracerModal.tsx src/svgParser.ts src/utils/svgSanitizer.ts src/utils/svgSanitizer.fixtures.ts
          git commit -m "security: sanitize imported SVG content"
          git push origin HEAD:security/svg-sanitization
